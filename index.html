<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Duel 🎲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1 class="title">🎲 Dice Duel 🎲</h1>
        <section class="arena">
            <div class="panel player-panel" id="player-panel">
                <div class="emoji">👽</div>
                <h2>Player</h2>
                <div class="dice" id="player-dice">❓</div>
                <div class="points">Points: <span id="player-points">0</span></div>
            </div>
            <div class="vs">VS</div>
            <div class="panel computer-panel" id="computer-panel">
                <div class="emoji">💻</div>
                <h2>Computer</h2>
                <div class="dice" id="computer-dice">❓</div>
                <div class="points">Points: <span id="computer-points">0</span></div>
            </div>
        </section>
        <section class="controls">
            <button id="roll-btn" class="btn btn-roll">🎲 Roll Dice</button>
            <button id="reset-btn" class="btn btn-reset">🔄 Reset</button>
        </section>
        <ol class="log" id="log"></ol>
    </main>

    <script src="script.js"></script>
</body>
</html>
